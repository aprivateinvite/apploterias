name: Gerar APK Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permite rodar o workflow manualmente

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ☕ Configurar Java 17 (Necessário para Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📦 Instalar Dependências e Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet
          pip install -r requirements.txt

      - name: 📱 Configurar Flutter (Usado pelo Flet)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: ⚙️ Construir APK
        run: flet build apk

      - name: 📤 Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: AppLoterias-APK
          path: build/apk/**/*.apk
